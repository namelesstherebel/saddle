rules:
- id: javascript_buf_rule-buffer-noassert-read
  patterns:
  - pattern: $OBJ.$METHOD(..., true)
  - metavariable-regex:
      metavariable: $METHOD
      regex: 
        ^(readUInt8|readUInt16LE|readUInt16BE|readUInt32LE|readUInt32BE|readUInt32BE|readInt8|readInt16LE|readInt16BE|readInt32LE|readInt32BE|readFloatLE|readFloatBE|readDoubleLE|readDoubleBE)$
  severity: WARNING
  languages:
  - javascript
  metadata:
    owasp:
    - A6:2017-Security Misconfiguration
    - A05:2021-Security Misconfiguration
    cwe: CWE-125
    shortDescription: Out-of-bounds read
    security-severity: MEDIUM
    category: security
    source-rule-url: 
      https://github.com/nodesecurity/eslint-plugin-security/blob/master/rules/detect-buffer-noassert.js
  message: "The application is using Buffer API methods with the `noAssert` \nparameter
    set to `true` for the read buffer methods. This disables \nthe bounds checking
    and could result in reading beyond the end of \nthe buffer, leading to potential
    memory corruption and security \nvulnerabilities. When `noAssert` is set to `true`,
    the methods \ndo not perform bounds checking, allowing the offset to be beyond\
    \ \nthe end of the buffer. This can lead to out-of-bounds memory access, \ncausing
    undefined behavior, crashes, or potential security exploits.\n\nTo mitigate the
    issue, ensure that the `noAssert` parameter is not \nset to `true`. Always use
    bounds checking to prevent out-of-bounds \nmemory access. Validate the offset
    before performing read operations \non the buffer.\n\nSecure Code Example:\n```\n\
    \  const buffer = Buffer.alloc(10); // Allocate a buffer of 10 bytes\n\n  function
    safeBufferMethods(buf) {\n    const safeOffset = 5; // An offset within the bounds
    of the buffer\n\n    // Secure read methods\n    if (safeOffset < buf.length)
    {\n      buf.readUInt8(safeOffset);\n      buf.readUInt16LE(safeOffset);\n   \
    \   buf.readUInt16BE(safeOffset);\n      buf.readUInt32LE(safeOffset);\n     \
    \ buf.readUInt32BE(safeOffset);\n      buf.readInt8(safeOffset);\n      buf.readInt16LE(safeOffset);\n\
    \      buf.readInt16BE(safeOffset);\n      buf.readInt32LE(safeOffset);\n    \
    \  buf.readInt32BE(safeOffset);\n      buf.readFloatLE(safeOffset);\n      buf.readFloatBE(safeOffset);\n\
    \      buf.readDoubleLE(safeOffset);\n      buf.readDoubleBE(safeOffset);\n  \
    \  }\n  }\n  try {\n    safeBufferMethods(buffer);\n  } catch (error) {\n    console.error('Caught
    an error:', error);\n  }\n```\n"
- id: javascript_buf_rule-buffer-noassert-write
  patterns:
  - pattern: $OBJ.$METHOD(..., true)
  - metavariable-regex:
      metavariable: $METHOD
      regex: 
        ^(writeUInt8|writeUInt16LE|writeUInt16BE|writeUInt32LE|writeUInt32BE|writeInt8|writeInt16LE|writeInt16BE|writeInt32LE|writeInt32BE|writeFloatLE|writeFloatBE|writeDoubleLE|writeDoubleBE)$
  severity: WARNING
  languages:
  - javascript
  metadata:
    owasp:
    - A6:2017-Security Misconfiguration
    - A05:2021-Security Misconfiguration
    cwe: CWE-787
    shortDescription: Out-of-bounds write
    security-severity: MEDIUM
    category: security
    source-rule-url: 
      https://github.com/nodesecurity/eslint-plugin-security/blob/master/rules/detect-buffer-noassert.js
  message: "The application is using Buffer API methods with the `noAssert` \nparameter
    set to `true` for the write buffer methods. This disables \nthe bounds checking
    and could result in writing beyond the end of \nthe buffer, leading to potential
    memory corruption and security \nvulnerabilities. When `noAssert` is set to `true`,
    the methods \ndo not perform bounds checking, allowing the offset to be beyond\
    \ \nthe end of the buffer. This can lead to out-of-bounds memory access, \ncausing
    undefined behavior, crashes, or potential security exploits.\n\nTo mitigate the
    issue, ensure that the `noAssert` parameter is not \nset to `true`. Always use
    bounds checking to prevent out-of-bounds \nmemory access. Validate the offset
    before performing write operations \non the buffer.\n\nSecure Code Example:\n\
    ```\n  const buffer = Buffer.alloc(10); // Allocate a buffer of 10 bytes\n\n \
    \ function safeBufferMethods(buf) {\n    const safeOffset = 5; // An offset within
    the bounds of the buffer\n\n    // Secure write methods\n    if (safeOffset <
    buf.length) {\n      buf.writeUInt8(0, safeOffset);\n      buf.writeUInt16LE(0,
    safeOffset);\n      buf.writeUInt16BE(0, safeOffset);\n      buf.writeUInt32LE(0,
    safeOffset);\n      buf.writeUInt32BE(0, safeOffset);\n      buf.writeInt8(0,
    safeOffset);\n      buf.writeInt16LE(0, safeOffset);\n      buf.writeInt16BE(0,
    safeOffset);\n      buf.writeInt32LE(0, safeOffset);\n      buf.writeInt32BE(0,
    safeOffset);\n      buf.writeFloatLE(0, safeOffset);\n      buf.writeFloatBE(0,
    safeOffset);\n      buf.writeDoubleLE(0, safeOffset);\n      buf.writeDoubleBE(0,
    safeOffset);\n    }\n  }\n\n  try {\n    safeBufferMethods(buffer);\n  } catch
    (error) {\n    console.error('Caught an error:', error);\n  }\n```\n"
- id: javascript_buf_rule-detect-new-buffer
  languages:
  - javascript
  - typescript
  patterns:
  - patterns:
    - pattern-not-inside: "require(\"safe-buffer\")\n..."
    - pattern-not-inside: "import { Buffer } from \"safe-buffer\"\n..."
    - pattern-inside: function $FUNC(..., $X, ...) { ... }
    - pattern: new Buffer($X,...)
  - pattern-not: "new Buffer(\"...\",...)\n"
  - pattern-not: "new Buffer([...] , ...)\n"
  message: "The application was found calling  the `new Buffer` constructor which
    has been deprecated\nsince Node 8.\nBy passing in a non-literal value, an adversary
    could allocate large amounts of memory.\n\nOther issues also exist with the `Buffer`
    constructor:\n- Older versions would return uninitialized memory, which could
    contain sensitive information\n- Unable to easily determine what a Buffer contained
    if passed a non-literal value\n\nTo remediate this issue, use `Buffer.alloc` or
    `Buffer.from` instead to allocate a new\n`Buffer`.\n\nExample using `Buffer.alloc`
    instead of `new Buffer(...)`:\n```\n// Create a new buffer using Buffer.from\n\
    const buf = Buffer.from([1, 2, 3, 4]);\n// Work with buf\n```\n\nFor more information
    on migrating to `Buffer.from()`/`Buffer.alloc()` see:\n- https://nodejs.org/en/docs/guides/buffer-constructor-deprecation\n"
  metadata:
    shortDescription: Allocation of resources without limits or throttling
    cwe: CWE-770
    category: security
    owasp:
    - A9:2017-Using Components with Known Vulnerabilities
    - A06:2021-Vulnerable and Outdated Components
    source-rule-url: 
      https://github.com/eslint-community/eslint-plugin-security/blob/main/rules/detect-new-buffer.js
    security-severity: Medium
  severity: WARNING
- id: javascript_dos_rule-non-literal-regexp
  languages:
  - javascript
  - typescript
  pattern-either:
  - patterns:
    - pattern: "new RegExp(...)\n"
    - pattern-not: "new RegExp(\"...\", ...)\n"
    - pattern-not: "new RegExp(/.../, ...)\n"
  - patterns:
    - pattern: "RegExp(...)\n"
    - pattern-not: "RegExp(\"...\", ...)\n"
    - pattern-not: "RegExp(/.../, ...)\n"
  - patterns:
    - pattern: "\"...\".$METHOD(...)\n"
    - pattern-not: "\"...\".$METHOD(\"...\")\n"
    - pattern-not: "\"...\".$METHOD(/.../)\n"
    - metavariable-regex:
        metavariable: $METHOD
        regex: ^(match|search)$
  message: "The `RegExp` constructor was called with a non-literal value. If an adversary
    were able to\nsupply a malicious regex, they could cause a Regular Expression
    Denial of Service (ReDoS)\nagainst the application. In Node applications, this
    could cause the entire application to no\nlonger be responsive to other users'
    requests.\n\nTo remediate this issue, never allow user-supplied regular expressions.
    Instead, the regular \nexpression should be  hardcoded. If this is not possible,
    consider using an alternative regular\nexpression engine such as [node-re2](https://www.npmjs.com/package/re2).
    RE2 is a safe alternative \nthat does not support backtracking, which is what
    leads to ReDoS.\n\nExample using re2 which does not support backtracking (Note:
    it is still recommended to\nnever use user-supplied input):\n```\n// Import the
    re2 module\nconst RE2 = require('re2');\n\nfunction match(userSuppliedRegex, userInput)
    {\n    // Create a RE2 object with the user supplied regex, this is relatively
    safe\n    // due to RE2 not supporting backtracking which can be abused to cause
    long running\n    // queries\n    var re = new RE2(userSuppliedRegex);\n    //
    Execute the regular expression against some userInput\n    var result = re.exec(userInput);\n\
    \    // Work with the result\n}\n```\n\nFor more information on Regular Expression
    DoS see:\n- https://owasp.org/www-community/attacks/Regular_expression_Denial_of_Service_-_ReDoS\n"
  metadata:
    cwe: CWE-185
    shortDescription: Regular expression with non-literal value
    category: security
    owasp:
    - A1:2017-Injection
    - A03:2021-Injection
    security-severity: Medium
  severity: WARNING
- id: javascript_eval_rule-eval-with-expression
  languages:
  - javascript
  - typescript
  patterns:
  - pattern-either:
    - patterns:
      - pattern: "eval($OBJ)\n"
      - pattern-not: "eval(\"...\")\n"
    - patterns:
      - pattern: "$A.eval($OBJ)\n"
      - pattern-not: "$A.eval(\"...\")\n"
    - patterns:
      - pattern: "(..., eval)($OBJ)\n"
      - pattern-not: "(..., eval)(\"...\")\n"
    - patterns:
      - pattern: "$ALIAS = eval;\n...\n$ALIAS($OBJ)\n"
      - pattern-not: "$ALIAS = eval;\n...\n$ALIAS(\"...\")\n"
    - pattern: "new Function(..., \"...\" + $OBJ + \"...\")\n"
    - pattern: "$BODY = \"...\" + $OBJ + \"...\"\n...\nnew Function(..., $BODY)\n"
    - pattern: "new Function(..., `...${...}...`)\n"
    - pattern: "$BODY = `...${...}...`\n...\nnew Function(..., $BODY)\n"
    - pattern: "Function(..., \"...\" + $OBJ + \"...\")\n"
    - pattern: "$BODY = \"...\" + $OBJ + \"...\"\n...\nFunction(..., $BODY)\n"
    - pattern: "$BODY = `...${...}...`\n...\nFunction(..., $BODY)\n"
    - pattern: "Function(..., `...${...}...`)\n"
    - pattern: "setTimeout(\"...\" + $OBJ + \"...\", ...)\n"
    - pattern: "setTimeout(`...${...}...`, ...)\n"
    - pattern: "setInterval(\"...\" + $OBJ + \"...\", ...)\n"
    - pattern: "setInterval(`...${...}...`, ...)\n"
  - pattern-not: "setTimeout(\"...\", ...)\n"
  - pattern-not: "setInterval(\"...\", ...)\n"
  severity: WARNING
  message: "The application was found calling the `eval` function OR Function()\n\
    \  constructor OR setTimeout() OR setInterval() methods. If the\n\n  variables
    or strings or functions passed to these methods contains user-supplied input,
    an adversary could attempt to execute arbitrary\n\n  JavaScript\n\n  code. This
    could lead to a full system compromise in Node applications or Cross-site Scripting\n\
    \n  (XSS) in web applications.\n\n\n  To remediate this issue, remove all calls
    to above methods and consider alternative methods for\n\n  executing\n\n  the
    necessary business logic. There is almost no safe method of calling `eval` or
    other above stated sinks with\n\n  user-supplied input.\n\n  Instead, consider
    alternative methods such as using property accessors to dynamically access\n\n\
    \  values.\n\n\n  Example using property accessors to dynamically access an object's
    property:\n\n  ```\n\n  // Define an object\n\n  const obj = {key1: 'value1',
    key2: 'value2'};\n\n  // Get key dynamically from user input\n\n  const key =
    getUserInput();\n\n  // Check if the key exists in our object and return it, or
    a default empty string\n\n  const value = (obj.hasOwnProperty(key)) ? obj[key]
    : '';\n\n  // Work with the value\n\n  ```\n\n\n  For more information on why
    not to use `eval`, and alternatives see:\n\n  - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/eval#never_use_eval!\n\
    \n  Other References:\n\n  - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Function/Function\n\
    \n  - https://developer.mozilla.org/en-US/docs/Web/API/setTimeout\n\n  - https://developer.mozilla.org/en-US/docs/Web/API/setInterval\n"
  metadata:
    cwe: CWE-95
    shortDescription: Improper neutralization of directives in dynamically 
      evaluated code ('Eval Injection')
    category: security
    owasp:
    - A1:2017-Injection
    - A03:2021-Injection
    - A05:2025-Injection
    source-rule-url: 
      https://github.com/nodesecurity/eslint-plugin-security/blob/master/rules/detect-eval-with-expression.js
    security-severity: High
- id: javascript_pathtraversal_rule-non-literal-fs-filename
  languages:
  - typescript
  - javascript
  patterns:
  - pattern-either:
    - pattern-inside: "import $MOD from $IMP\n...\n"
    - pattern-inside: "$MOD = require($IMP)\n...\n"
  - metavariable-comparison:
      metavariable: $IMP
      comparison: $IMP in ['fs', 'node:fs', 'fs/promises', 'node:fs/promises', 
        'fs-extra']
  - pattern-not: $MOD.appendFile("...", ...)
  - pattern-not: $MOD.appendFileSync("...", ...)
  - pattern-not: $MOD.chmod("...", ...)
  - pattern-not: $MOD.chmodSync("...", ...)
  - pattern-not: $MOD.chown("...", ...)
  - pattern-not: $MOD.chownSync("...", ...)
  - pattern-not: $MOD.createReadStream("...", ...)
  - pattern-not: $MOD.createWriteStream("...", ...)
  - pattern-not: $MOD.exists("...", ...)
  - pattern-not: $MOD.existsSync("...", ...)
  - pattern-not: $MOD.lchmod("...", ...)
  - pattern-not: $MOD.lchmodSync("...", ...)
  - pattern-not: $MOD.lchown("...", ...)
  - pattern-not: $MOD.lchownSync("...", ...)
  - pattern-not: $MOD.link("...", "...", ...)
  - pattern-not: $MOD.linkSync("...", "...", ...)
  - pattern-not: $MOD.lstat("...", ...)
  - pattern-not: $MOD.lstatSync("...", ...)
  - pattern-not: $MOD.mkdir("...", ...)
  - pattern-not: $MOD.mkdirSync("...", ...)
  - pattern-not: $MOD.open("...", ...)
  - pattern-not: $MOD.openSync("...", ...)
  - pattern-not: $MOD.readdir("...", ...)
  - pattern-not: $MOD.readdirSync("...", ...)
  - pattern-not: $MOD.readFile("...", ...)
  - pattern-not: $MOD.readFileSync("...", ...)
  - pattern-not: $MOD.readlink("...", ...)
  - pattern-not: $MOD.readlinkSync("...", ...)
  - pattern-not: $MOD.realpath("...", ...)
  - pattern-not: $MOD.realpathSync("...", ...)
  - pattern-not: $MOD.rename("...", "...", ...)
  - pattern-not: $MOD.renameSync("...", "...", ...)
  - pattern-not: $MOD.rmdir("...", ...)
  - pattern-not: $MOD.rmdirSync("...", ...)
  - pattern-not: $MOD.stat("...", ...)
  - pattern-not: $MOD.statSync("...", ...)
  - pattern-not: $MOD.symlink("...", "...", ...)
  - pattern-not: $MOD.symlinkSync("...", "...", ...)
  - pattern-not: $MOD.truncate("...", ...)
  - pattern-not: $MOD.truncateSync("...", ...)
  - pattern-not: $MOD.unlink("...", ...)
  - pattern-not: $MOD.unlinkSync("...", ...)
  - pattern-not: $MOD.unwatchFile("...", ...)
  - pattern-not: $MOD.utimes("...", ...)
  - pattern-not: $MOD.utimesSync("...", ...)
  - pattern-not: $MOD.watch("...", ...)
  - pattern-not: $MOD.watchFile("...", ...)
  - pattern-not: $MOD.writeFile("...", ...)
  - pattern-not: $MOD.writeFileSync("...", ...)
  - pattern-either:
    - pattern: $MOD.appendFile(...)
    - pattern: $MOD.appendFileSync(...)
    - pattern: $MOD.chmod(...)
    - pattern: $MOD.chmodSync(...)
    - pattern: $MOD.chown(...)
    - pattern: $MOD.chownSync(...)
    - pattern: $MOD.createReadStream(...)
    - pattern: $MOD.createWriteStream(...)
    - pattern: $MOD.exists(...)
    - pattern: $MOD.existsSync(...)
    - pattern: $MOD.lchmod(...)
    - pattern: $MOD.lchmodSync(...)
    - pattern: $MOD.lchown(...)
    - pattern: $MOD.lchownSync(...)
    - pattern: $MOD.link(...)
    - pattern: $MOD.linkSync(...)
    - pattern: $MOD.lstat(...)
    - pattern: $MOD.lstatSync(...)
    - pattern: $MOD.mkdir(...)
    - pattern: $MOD.mkdirSync(...)
    - pattern: $MOD.open(...)
    - pattern: $MOD.openSync(...)
    - pattern: $MOD.readdir(...)
    - pattern: $MOD.readdirSync(...)
    - pattern: $MOD.readFile(...)
    - pattern: $MOD.readFileSync(...)
    - pattern: $MOD.readlink(...)
    - pattern: $MOD.readlinkSync(...)
    - pattern: $MOD.realpath(...)
    - pattern: $MOD.realpathSync(...)
    - pattern: $MOD.rename(...)
    - pattern: $MOD.renameSync(...)
    - pattern: $MOD.rmdir(...)
    - pattern: $MOD.rmdirSync(...)
    - pattern: $MOD.stat(...)
    - pattern: $MOD.statSync(...)
    - pattern: $MOD.symlink(...)
    - pattern: $MOD.symlinkSync(...)
    - pattern: $MOD.truncate(...)
    - pattern: $MOD.truncateSync(...)
    - pattern: $MOD.unlink(...)
    - pattern: $MOD.unlinkSync(...)
    - pattern: $MOD.unwatchFile(...)
    - pattern: $MOD.utimes(...)
    - pattern: $MOD.utimesSync(...)
    - pattern: $MOD.watch(...)
    - pattern: $MOD.watchFile(...)
    - pattern: $MOD.writeFile(...)
    - pattern: $MOD.writeFileSync(...)
  message: "The application dynamically constructs file or path information. If the
    path\ninformation comes from user-supplied input, it could be abused to read sensitive
    files,\naccess other users' data, or aid in exploitation to gain further system
    access.\n\nUser input should never be used in constructing paths or files for
    interacting\nwith the filesystem. This includes filenames supplied by user uploads
    or downloads.\nIf possible, consider hashing user input or using unique values
    and\nuse `path.normalize` to resolve and validate the path information\nprior
    to processing any file functionality.\n\nExample using `path.normalize` and not
    allowing direct user input:\n```\n// User input, saved only as a reference\n//
    id is a randomly generated UUID to be used as the filename\nconst userData = {userFilename:
    userSuppliedFilename, id: crypto.randomUUID()};\n// Restrict all file processing
    to this directory only\nconst basePath = '/app/restricted/';\n\n// Create the
    full path, but only use our random generated id as the filename\nconst joinedPath
    = path.join(basePath, userData.id);\n// Normalize path, removing any '..'\nconst
    fullPath = path.normalize(joinedPath);\n// Verify the fullPath is contained within
    our basePath\nif (!fullPath.startsWith(basePath)) {\n    console.log(\"Invalid
    path specified!\");\n}\n// Process / work with file\n// ...\n```\n\nFor more information
    on path traversal issues see OWASP:\nhttps://owasp.org/www-community/attacks/Path_Traversal\n"
  metadata:
    shortDescription: Improper limitation of a pathname to a restricted 
      directory ('Path Traversal')
    cwe: CWE-22
    owasp:
    - A5:2017-Broken Access Control
    - A01:2021-Broken Access Control
    - A01:2025-Broken Access Control
    security-severity: Medium
    category: security
  severity: WARNING
- id: javascript_random_rule-pseudo-random-bytes
  languages:
  - javascript
  - typescript
  pattern: crypto.pseudoRandomBytes
  severity: WARNING
  message: "Depending on the context, generating weak random numbers may expose cryptographic
    functions,\nwhich rely on these numbers, to be exploitable. When generating numbers
    for sensitive values\nsuch as tokens, nonces, and cryptographic keys, it is recommended
    that the `randomBytes` method\nof the `crypto` module be used instead of `pseudoRandomBytes`.\n\
    \nExample using `randomBytes`:\n```\n// Generate 256 bytes of random data\nconst
    randomBytes = crypto.randomBytes(256);\n```\n\nFor more information on JavaScript
    Cryptography see:\nhttps://nodejs.org/api/crypto.html#cryptorandombytessize-callback\n"
  metadata:
    cwe: CWE-338
    shortDescription: Use of cryptographically weak pseudo-random number 
      generator (PRNG)
    category: security
    owasp:
    - A3:2017-Sensitive Data Exposure
    - A02:2021-Cryptographic Failures
    - A04:2025-Cryptographic Failures
    source-rule-url: 
      https://github.com/nodesecurity/eslint-plugin-security/blob/master/rules/detect-pseudoRandomBytes.js
    security-severity: Medium
- id: javascript_react_rule-dangerouslysetinnerhtml
  languages:
  - typescript
  - javascript
  pattern-either:
  - pattern: "<$X dangerouslySetInnerHTML=... />\n"
  - pattern: "{dangerouslySetInnerHTML: ...}\n"
  severity: WARNING
  message: "The application was found calling `dangerouslySetInnerHTML` which may
    lead to Cross Site\nScripting (XSS). By default, React components will encode
    the data properly before rendering.\nCalling `dangerouslySetInnerHTML` disables
    this encoding and allows raw markup\nand JavaScript to be executed.\n\nXSS is
    an attack which exploits a web application or system to treat\nuser input as markup
    or script code. It is important to encode the data, depending on the\nspecific
    context it is used in. There are at least six context types:\n\n- Inside HTML
    tags `<div>context 1</div>`\n- Inside attributes: `<div class=\"context 2\"></div>`\n\
    - Inside event attributes `<button onclick=\"context 3\">button</button>`\n- Inside
    script blocks: `<script>var x = \"context 4\"</script>`\n- Unsafe element HTML
    assignment: `element.innerHTML = \"context 5\"`\n- Inside URLs: `<iframe src=\"\
    context 6\"></iframe><a href=\"context 6\">link</a>`\n\nScript blocks alone have
    multiple ways they need to be encoded. Extra care must be taken if\nuser input\n\
    is ever output inside of script tags.\n\nUser input that is displayed within the
    application must be encoded, sanitized or validated\nto ensure it cannot be treated
    as HTML or executed as Javascript code. Care must also be\ntaken\nto not mix server-side
    templating with client-side templating, as the server-side templating\nwill\n\
    not encode things like {{ 7*7 }} which may execute client-side templating features.\n\
    \nIt is _NOT_ advised to encode user input prior to inserting into a data store.
    The data will\nneed to be\nencoded depending on context of where it is output.
    It is much safer to force the displaying\nsystem to\nhandle the encoding and not
    attempt to guess how it should be encoded.\n\nRemove the call to `dangerouslySetInnerHTML`
    or ensure that the data used in this call does\nnot come from user-supplied input.\n\
    \nFor more information on dangerously setting inner HTML see:\n- https://react.dev/reference/react-dom/components/common#dangerously-setting-the-inner-html\n"
  metadata:
    cwe: CWE-79
    owasp:
    - A7:2017-Cross-Site Scripting (XSS)
    - A03:2021-Injection
    - A05:2025-Injection
    shortDescription: Improper neutralization of input during web page 
      generation ('Cross-site Scripting')
    category: security
    security-severity: Medium
- id: javascript_require_rule-non-literal-require
  languages:
  - javascript
  - typescript
  patterns:
  - pattern: require($OBJ)
  - pattern-not: require('...')
  severity: WARNING
  message: "The application was found to dynamically import a module by calling `require`
    using a\nnon-literal string. An adversary might be able to read the first line
    of\narbitrary files. If they had write access to the file system, they may also
    be able to\nexecute arbitrary code.\n\nTo remediate this issue, use a hardcoded
    string literal when calling `require`. Never call it\nit with dynamically created
    variables or user-supplied data.\n"
  metadata:
    cwe: CWE-95
    owasp:
    - A1:2017-Injection
    - A03:2021-Injection
    - A05:2025-Injection
    shortDescription: Improper neutralization of directives in dynamically 
      evaluated code ('Eval Injection')
    category: security
    source-rule-url: 
      https://github.com/nodesecurity/eslint-plugin-security/blob/master/rules/detect-non-literal-require.js
    security-severity: Low
- id: javascript_timing_rule-possible-timing-attacks
  languages:
  - javascript
  patterns:
  - pattern-not: if ($Z == null) { ... };
  - pattern-not: if ($Z === null) { ... };
  - pattern-not: if ($Z != null) { ... };
  - pattern-not: if ($Z !== null) { ... };
  - pattern-not: if ($Q != undefined) { ... };
  - pattern-not: if ($Q !== undefined) { ... };
