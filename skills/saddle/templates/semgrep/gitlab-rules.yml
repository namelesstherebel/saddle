- id: python_random_rule-random
  languages:
  - python
  message: "Depending on the context, generating weak random numbers may expose cryptographic
    functions,\nwhich rely on these numbers, to be exploitable. When generating numbers
    for sensitive values\nsuch as tokens, nonces, and cryptographic keys, it is recommended
    that the `secrets` module\nbe used instead.\n\nExample using the secrets module:\n\
    ```\nimport secrets\n\n# Generate a secure random 64 byte array\nrandom_bytes
    = secrets.token_bytes(64)\nprint(random_bytes)\n\n# Generate a secure random 64
    byte array as a hex string\nrandom_bytes_hex = secrets.token_hex(64)\n\n# Generate
    a secure random 64 byte array base64 encoded for use in URLs\nrandom_string =
    secrets.token_urlsafe(64)\n```\n\nFor more information on the `secrets` module
    see:\n- https://docs.python.org/3/library/secrets.html\n"
  metadata:
    cwe: CWE-338
    owasp:
    - A3:2017-Sensitive Data Exposure
    - A02:2021-Cryptographic Failures
    - A04:2025-Cryptographic Failures
    category: security
    shortDescription: Use of cryptographically weak pseudo-random number 
      generator (PRNG)
    security-severity: Low
  pattern-either:
  - pattern: random.random(...)
  - pattern: random.randrange(...)
  - pattern: random.randint(...)
  - pattern: random.choice(...)
  - pattern: random.uniform(...)
  - pattern: random.triangular(...)
  severity: WARNING
- id: python_requests_rule-request-without-timeout
  languages:
  - python
  message: "The application was found using the `requests` module without configuring
    a timeout value for\nconnections. This could lead to uncontrolled resource consumption
    where the application could\nrun out of\nsocket descriptors, effectively causing
    a Denial of Service (DoS).\n\nTo remediate this issue, pass in a `timeout=` argument
    to each `requests` call.\n\nExample using a timeout for an HTTP GET request:\n\
    ```\n# Issue a GET request to https://example.com with a timeout of 10 seconds\n\
    response = requests.get('https://example.com', timeout=10)\n# Work with the response
    object\n# ...\n```\n\nFor more information on using the requests module see:\n\
    - https://requests.readthedocs.io/en/latest/api/\n"
  patterns:
  - pattern-either:
    - patterns:
      - pattern: requests.$METHOD(..., timeout=$VAL, ...)
      - metavariable-comparison:
          comparison: $VAL <= 0
          metavariable: $VAL
    - patterns:
      - pattern: requests.$METHOD(..., timeout=$VAL, ...)
      - metavariable-regex:
          metavariable: $VAL
          regex: (^None)
    - patterns:
      - pattern-not: requests.$METHOD(..., timeout=$VAL, ...)
      - pattern-either:
        - pattern: requests.$METHOD(..., ...)
        - pattern: requests.$METHOD(...)
  - metavariable-regex:
      metavariable: $METHOD
      regex: (get|put|delete|post|options|head|patch)
  metadata:
    cwe: CWE-770
    category: security
    shortDescription: Allocation of resources without limits or throttling
    owasp:
    - A6:2017-Security Misconfiguration
    - A05:2021-Security Misconfiguration
    security-severity: Medium
  severity: WARNING
- id: python_snmp_rule-insecure-snmp-version
  languages:
  - python
  message: "Pysnmp was detected using versions SNMPv1 or SNMPv2. SNPMv1 and SNMPv2
    are insecure\nand should no longer be used as they do not offer encryption.\n\n\
    If possible, query SNMP devices using SNMPv3 instead.\n\nExample querying a device
    using SNMPv3 with SHA-AES:\n```\nfrom pysnmp.hlapi import *\n# Create the snpm
    iterator\niterator = getCmd(\n    SnmpEngine(),\n    # Configure using SHA AES\n\
    \    UsmUserData('usr-sha-aes', 'authkey1', 'privkey1',\n                authProtocol=USM_AUTH_HMAC96_SHA,\n\
    \                privProtocol=USM_PRIV_CFB128_AES),\n    UdpTransportTarget(('demo.snmplabs.com',
    161)),\n    ContextData(),\n    ObjectType(ObjectIdentity('SNMPv2-MIB', 'sysDescr',
    0))\n)\n```\n\nFor more information on using SNMPv3 with `Pysnmp` see:\n- https://pysnmp.readthedocs.io/en/latest/examples/hlapi/v3arch/asyncore/sync/manager/cmdgen/snmp-versions.html#snmpv3-auth-sha-privacy-aes128\n"
  metadata:
    cwe: CWE-319
    category: security
    shortDescription: Cleartext transmission of sensitive information
    owasp:
    - A3:2017-Sensitive Data Exposure
    - A02:2021-Cryptographic Failures
    - A04:2025-Cryptographic Failures
    security-severity: Medium
  pattern-either:
  - pattern: pysnmp.hlapi.CommunityData(..., mpModel=0, ...)
  - pattern: pysnmp.hlapi.CommunityData(..., mpModel=1, ...)
  severity: WARNING
- id: python_snmp_rule-snmp-weak-cryptography
  languages:
  - python
  message: "Pysnmp was detected using SNMPv3 without authentication or encryption\n\
    protections enabled.\n\n- Use of `usmNoAuthProtocol` or `usmNoPrivProtocol` indicates
    that\neither authentication or privacy, respectively, is not being used.  \n-
    The absence of  `authKey` (or `authKey=None`) implies no authentication, \nwhich
    is equivalent to using `usmNoAuthProtocol`. \n- The absence of `privKey` (or `privKey=None`)
    implies no privacy (encryption), \nwhich is equivalent to using `usmNoPrivProtocol`.\n\
    \nTo enhance the security of your SNMP communications, it is recommended to use
    both\nauthentication and privacy features in SNMPv3:\n\n- Use SHA for Authentication:
    SHA (Secure Hash Algorithm) is a more secure option \nfor SNMP message authentication.
    To use SHA, set the `authProtocol` to \n`usmHMACSHAAuthProtocol` and provide a
    strong `authKey`.\n- Use AES for Privacy: AES (Advanced Encryption Standard) is
    recommended for \nencrypting SNMP messages. Set the `privProtocol` to `usmAesCfb128Protocol`\n\
    or a similar AES-based protocol and specify a strong `privKey`.\n\nExample of
    secure `UsmUserData` configuration:\n``` \n  from pysnmp.hlapi import UsmUserData,
    usmHMACSHAAuthProtocol, usmAesCfb128Protocol\n      \n  user_data = UsmUserData('username','authKey',
    'privKey',           \n                        authProtocol=usmHMACSHAAuthProtocol,\n\
    \                        privProtocol=usmAesCfb128Protocol)\n```\n"
  metadata:
    cwe: CWE-319
    category: security
    shortDescription: Cleartext transmission of sensitive information
    owasp:
    - A3:2017-Sensitive Data Exposure
    - A02:2021-Cryptographic Failures
    - A04:2025-Cryptographic Failures
    security-severity: Medium
  pattern-either:
  - pattern-regex: UsmUserData(.*usmNoAuthProtocol.*)
  - pattern-regex: UsmUserData(.*usmNoPrivProtocol.*)
  - pattern: "UsmUserData(..., authKey=None, ...)\n"
  - pattern: "UsmUserData(..., privKey=None, ...)\n"
  - pattern: "UsmUserData(..., authProtocol=(1,3,6,1,6,3,10,1,1,1), ...)\n"
  - pattern: "UsmUserData(..., privProtocol=(1,3,6,1,6,3,10,1,2,1), ...)\n"
  - patterns:
    - pattern-not: "UsmUserData($NAME,$AUTHKEY,\"...\", ...)\n"
    - pattern-not: "UsmUserData(..., privKey=$PRIVKEY, ...)\n"
    - pattern-not: "UsmUserData(..., privProtocol=$PRIVPROT, ...)\n"
    - pattern: "UsmUserData(...)\n"
  severity: WARNING
- id: python_sql_rule-hardcoded-sql-expression
  languages:
  - python
  message: "SQL Injection is a critical vulnerability that can lead to data or system
    compromise. By\ndynamically generating SQL query strings, user input may be able
    to influence the logic of\nthe SQL statement. This could lead to an adversary
    accessing information they should\nnot have access to, or in some circumstances,
    being able to execute OS functionality or code.\n\nReplace all dynamically generated
    SQL queries with parameterized queries. In situations where\ndynamic queries must
    be created, never use direct user input, but instead use a map or\ndictionary
    of valid values and resolve them using a user supplied key.\n\nFor example, some
    database drivers do not allow parameterized queries for `>` or `<` comparison\n\
    operators. In these cases, do not use a user supplied `>` or `<` value, but rather
    have the\nuser\nsupply a `gt` or `lt` value. The alphabetical values are then
    used to look up the `>` and `<`\nvalues to be used in the construction of the
    dynamic query. The same goes for other queries\nwhere\ncolumn or table names are
    required but cannot be parameterized.\n\nExample using `PreparedStatement` queries:\n\
    ```\nimport sqlite3\n\n# Create a new database (in memory)\ncon = sqlite3.connect(\"\
    :memory:\")\n# Get a cursor from the connection\ncur = con.cursor()\n# Create
    a tuple of the value to be used in the parameterized query\nparams = ('user-input',)\n\
    # execute the statement, passing in the params for the value\ncur.execute(\"select
    name from sqlite_master where name = ?\", params)\n# work with the result\nresult
    = cur.fetchall()\n```\n\nFor more information on SQL Injection see OWASP:\nhttps://cheatsheetseries.owasp.org/cheatsheets/SQL_Injection_Prevention_Cheat_Sheet.html\n"
  metadata:
    cwe: CWE-89
    owasp:
    - A1:2017-Injection
    - A03:2021-Injection
    - A05:2025-Injection
    category: security
    shortDescription: Improper neutralization of special elements used in an SQL
      Command ('SQL Injection')
    security-severity: High
  mode: taint
  pattern-sources:
  - patterns:
    - pattern-either:
      - pattern: "\"$QUERY\" % ...\n"
      - pattern: "\"$QUERY\".format(...)\n"
      - pattern: "f\"$QUERY{...}...\"\n"
      - pattern: "\"$QUERY\" + ...\n"
      - pattern: "$TMP = \"$QUERY\"\n...\n$SQL = $TMP + \"...\" % ...\n"
      - pattern: "$SQL = \"$QUERY\"\n...\n$SQL += ...              \n"
    - metavariable-regex:
        metavariable: $QUERY
        regex: (?i)^(SELECT|INSERT|UPDATE|DELETE)\s
  pattern-sinks:
  - patterns:
