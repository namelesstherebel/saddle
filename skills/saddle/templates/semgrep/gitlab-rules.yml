- id: python_crypto_rule-crypto-hash-md5
  languages:
  - python
  message: "The application was found using an insecure or risky digest or signature
    algorithm. MD5\nand SHA1 hash algorithms have been found to be vulnerable to producing
    collisions.\n\nThis means\nthat two different values, when hashed, can lead to
    the same hash value. If the application is\ntrying\nto use these hash methods
    for storing passwords, then it is recommended to switch to a\npassword hashing\n\
    algorithm such as Argon2id or PBKDF2.\nIt is strongly recommended that a standard
    digest algorithm be chosen instead as implementing\na custom algorithm is prone
    to errors.\n\nNote that the `Crypto` and `Cryptodome` Python packages are no longer
    recommended for\nnew applications, instead consider using the [cryptography](https://cryptography.io/)
    package.\n\nExample of creating a SHA-384 hash using the `cryptography` package:\n\
    ```\nfrom cryptography.hazmat.primitives import hashes\n# Create a SHA384 digest\n\
    digest = hashes.Hash(hashes.SHA384())\n# Update the digest with some initial data\n\
    digest.update(b\"some data to hash\")\n# Add more data to the digest\ndigest.update(b\"\
    some more data\")\n# Finalize the digest as bytes\nresult = digest.finalize()\n\
    ```\n\nFor more information on secure password storage see OWASP:\n- https://cheatsheetseries.owasp.org/cheatsheets/Password_Storage_Cheat_Sheet.html\n\
    \nFor more information on the cryptography module see:\n- https://cryptography.io/en/latest/\n"
