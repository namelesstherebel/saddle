    cwe: CWE-502
    owasp:
    - A8:2017-Insecure Deserialization
    - A08:2021-Software and Data Integrity Failures
    - A08:2025-Software or Data Integrity Failures
    category: security
    shortDescription: Deserialization of untrusted data
    security-severity: High
  severity: ERROR
- id: python_django_rule-django-extra-used
  languages:
  - python
  message: "SQL Injection is a critical vulnerability that can lead to data or system
    compromise. By\ndynamically generating SQL query strings, user input may be able
    to influence the logic of\nthe SQL statement. This could lead to an adversary
    accessing information they should\nnot have access to, or in some circumstances,
    being able to execute OS functionality or code.\n\nReplace all dynamically generated
    SQL queries with parameterized queries. In situations where\ndynamic queries must
    be created, never use direct user input, but instead use a map or\ndictionary
    of valid values and resolve them using a user supplied key.\n\nFor example, some
    database drivers do not allow parameterized queries for `>` or `<` comparison\n\
    operators. In these cases, do not use a user supplied `>` or `<` value, but rather
    have the\nuser\nsupply a `gt` or `lt` value. The alphabetical values are then
    used to look up the `>` and `<`\nvalues to be used in the construction of the
    dynamic query. The same goes for other queries\nwhere\ncolumn or table names are
    required but cannot be parameterized.\n\nThe `QuerySet.extra` API method will
    be deprecated as it a source of SQL Injection\nvulnerabilities and other problems.
    This method is especially risky as callers\nwill need to do their own escaping
    of any parameters that come from user-supplied\ninformation.\n\nTo remediate this
    issue, do not use `extra` but use other `QuerySet` methods to achieve\nthe same
    goals. If for some reason this is not feasible, consider using the `RawSQL` method\n\
    and making sure that all arguments, including user-supplied ones, are only used
    in\n`params`\n\n\nWhile not recommended due to [potential SQL\nInjection](https://docs.djangoproject.com/en/4.2/ref/models/expressions/#raw-sql-expressions),\n\
    below is an example using `RawSQL`,\npassing in user-supplied data as a `param`
    which will escape the input:\n```\n# If dealing with integer based user input,
    restrict the values to integers only using the\n# path configuration: path('<int:user_supplied_id>/someview/',
    views.some_view,\nname='someview'),\n\n# views.py\ndef some_view(request, user_supplied_id):\n\
    \  # Never use string interpolation in the `sql` parameter.\n  # Never quote the
    `%s` string format such as `... where id='%s'` as this could lead to SQL\nInjection.\n\
    \  # Pass the user supplied data only in the `params` parameter.\n  for obj in
    DBObject.objects.all().annotate(\n      val=RawSQL(sql=\"select id from some_secondary_table
    where id=%s\",\nparams=[user_supplied_id])):\n    # Work with the results from
    the query\n    # ...\n```\n\nFor more information on QuerySet see:\n- https://docs.djangoproject.com/en/4.2/ref/models/querysets/#queryset-api\n\
    \nFor more information on SQL Injection see OWASP:\n- https://cheatsheetseries.owasp.org/cheatsheets/SQL_Injection_Prevention_Cheat_Sheet.html\n"
  patterns:
  - pattern: $X.objects. ... .extra(..., $K = $V, ...)
  - pattern-not-inside: "$V = ['...']\n...\n"
  - metavariable-pattern:
      metavariable: $V
      patterns:
      - pattern: $V
      - pattern-not: "[..., '...', ...]"
      - pattern-not: "{..., '...': '...', ...}"
      - pattern-not: '"..."'
      - pattern-not: '[..., "..." % "...", ...]'
      - pattern-not: '{..., $L: "..." % "...", ...}'
      - pattern-not: '{..., $L: "...".format("..."), ...}'
      - pattern-not: '[..., "...".format("..."), ...]'
  metadata:
    cwe: CWE-89
    owasp:
    - A1:2017-Injection
    - A03:2021-Injection
    - A05:2025-Injection
    category: security
    shortDescription: Improper neutralization of special elements used in an SQL
      Command ('SQL Injection')
    security-severity: High
  severity: WARNING
- id: python_escaping_rule-jinja2-autoescape-false
  languages:
  - python
  message: "The application was found using Jinja2 `Environment` without autoescaping
    enabled. If using in\nthe context of HTML this could lead to Cross-Site Scripting
    (XSS) attacks when rendering with\nuser-supplied input.\n\nUnfortunately, Jinja2
    does not support context-aware escaping, meaning it is insufficient to\nprotect
    against\nXSS for the various web contexts. It is important to encode the data
    depending on the specific\ncontext\nit\nis used in. There are at least six context
    types:\n\n- Inside HTML tags `<div>context 1</div>`\n- Inside attributes: `<div
    class=\"context 2\"></div>`\n- Inside event attributes `<button onclick=\"context
    3\">button</button>`\n- Inside script blocks: `<script>var x = \"context 4\"</script>`\n\
    - Unsafe element HTML assignment: `element.innerHTML = \"context 5\"`\n- Inside
    URLs: `<iframe src=\"context 6\"></iframe><a href=\"context 6\">link</a>`\n\n\
    Script blocks alone have multiple ways they need to be encoded. Extra care must
    be taken if\nuser input\nis ever output inside of script tags.\n\nUser input that
    is displayed within the application must be encoded, sanitized or validated\n\
    to ensure it cannot be treated as HTML or executed as Javascript code. Care must
    also be\ntaken\nto not mix server-side templating with client-side templating,
    as the server-side templating\nwill\nnot encode things like {{ 7*7 }} which may
    execute client-side templating features.\n\nIt is _NOT_ advised to encode user
    input prior to inserting into a data store. The data will\nneed to be\nencoded
    depending on context of where it is output. It is much safer to force the displaying\n\
    system to\nhandle the encoding and not attempt to guess how it should be encoded.\n\
    \nTo handle different contexts, one approach would be to write custom Jinja2 filters.
    Below is\nan example\nthat escapes or encodes links and potentially malicious
    script, note this does not include\nother contexts\nsuch as CSS or attributes:\n\
    ```\nfrom jinja2 import Environment, select_autoescape, FileSystemLoader\nfrom
    jinja2 import pass_eval_context\nfrom markupsafe import Markup, escape\n\n@pass_eval_context\n\
    def escape_link(eval_ctx, value):\n    bad_link = \"#JinjatmplZ\"\n    # Block
    any values that start with // as that could be used to inject\n    # links to
    third party pages see:\nhttps://en.wikipedia.org/wiki/Wikipedia:Protocol-relative_URL\n\
    \    if value.startswith('//'):\n        return bad_link\n\n    # Only allow relative
    links\n    # if you want to allow links that start with http or ws replace with
    below:\n    # if not value.startswith('/'): and not value.startswith('http') and
    not\nvalue.startswith('ws')\n    if not value.startswith('/'):\n        return
    bad_link\n\n    # Alternatively, you could only call escape if autoescape is true\n\
    \    # if eval_ctx.autoescape:\n    #    return escape(value)\n    # else\n  \
    \  #    return value\n\n    return escape(value)\n\n# Create a replacement table\n\
    js_replacement = str.maketrans({\n        '\"':  \"\\\\u0022\",\n        '`':\
    \  \"\\\\u0060\",\n        '&':  \"\\\\u0026\",\n        '\\'': \"\\\\u0027\"\
    ,\n        '+':  \"\\\\u002b\",\n        '/':  \"\\\\/\",\n        '<':  \"\\\\\
    u003c\",\n        '>':  \"\\\\u003e\",\n        '\\\\': \"\\\\\\\\\",\n      \
    \  '(': \"\\\\u0028\",\n        ')': \"\\\\u0029\",\n    })\n\n@pass_eval_context\n\
    def escape_js(eval_ctx, value):\n    \"\"\"\n    Escape the input for use in <script>
    context, USE WITH CAUTION\n    It is strongly recommended to _never_ pass user-supplied
    input to\n    the JavaScript context. This may still be unsafe depending where\n\
    \    used, it does not consider characters used  in regular expressions\n    for
    example.\n    \"\"\"\n\n    #if eval_ctx.autoescape:\n    #    value = escape(value)\n\
    \    # Escape by default\n    value = escape(value)\n    # Translate any potential
    characters using our translation table\n    return value.translate(js_replacement)\n\
    \n# Create our environment, setting autoescape to use the default\n# select_autoescape
    function\nenv = Environment(\n    loader=FileSystemLoader(os.getcwd()+\"/template\"\
    ),\n    autoescape=select_autoescape,\n)\n# Add an escape link filter to be used
    in our template\nenv.filters[\"escape_link\"] = escape_link\nenv.filters[\"escape_js\"\
    ] = escape_js\n# Load our template file\ntemplate = env.get_template(\"mytemplate.html\"\
    )\n# Render with different variables which call our filters\nprint(template.render(\n\
    \    html_context=\"<img src=x onerror=alert(1)>\",\n    link_context=\"/# onclick=alert(1)<script>alert(1)</script>\"\
    ,\n    script_context=\"alert(1);alert`1`\",)\n)\n\n# Sample template:\n\"\"\"\
    \n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <title>My Webpage</title>\n\
    </head>\n<body>\n    <h1>My Webpage</h1>\n    {{ html_context }}\n    <a href=\"\
    {{ link_context | escape_link }}\">link</a>\n    <script>{{ script_context | escape_js
    }}</script>\n</body>\n</html>\n\"\"\"\n```\n\nFor more information on autoescape
    see:\n- https://jinja.palletsprojects.com/en/3.1.x/api/#autoescaping\n\nFor more
    information on XSS see OWASP:\n- https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html\n"
  metadata:
    cwe: CWE-116
    owasp:
    - A7:2017-Cross-Site Scripting (XSS)
    - A03:2021-Injection
    - A05:2025-Injection
    category: security
    shortDescription: Improper encoding or escaping of output
    security-severity: Medium
  patterns:
  - pattern-inside: "import jinja2\n...\n"
  - pattern-not: jinja2.Environment(..., autoescape=True, ...)
  - pattern-not: jinja2.Environment(..., 
      autoescape=jinja2.select_autoescape(...),...)
  - pattern-not: jinja2.Environment(..., autoescape=select_autoescape(...), ...)
  - pattern: jinja2.Environment(...)
  severity: WARNING
- id: python_escaping_rule-use-of-mako-templates
  languages:
  - python
  message: "The application was found using mako templates without `default_filters`\n\
    being passed to the `Template` or `TemplateLookup` constructors. If using \nin
    the context of HTML, this could lead to Cross-Site Scripting (XSS) attacks \n\
    when rendering with user-supplied input.\n\nUnfortunately, Jinja2 does not support
    context-aware escaping, meaning it\nis insufficient to protect against XSS for
    the various web contexts. It is \nimportant to encode the data depending on the
    specific context it is used in. \nThere are at least six context types:\n\n- Inside
    HTML tags `<div>context 1</div>`\n- Inside attributes: `<div class=\"context 2\"\
    ></div>`\n- Inside event attributes `<button onclick=\"context 3\">button</button>`\n\
    - Inside script blocks: `<script>var x = \"context 4\"</script>`\n- Unsafe element
    HTML assignment: `element.innerHTML = \"context 5\"`\n- Inside URLs: \n`<iframe
    src=\"context 6\"></iframe><a href=\"context 6\">link</a>`\n\nScript blocks alone
    have multiple ways they need to be encoded. Extra care\nmust be taken if user
    input is ever output inside of script tags.\n\nUser input that is displayed within
    the application must be encoded,\nsanitized or validated to ensure it cannot be
    treated as HTML or executed \nas Javascript code. Care must also be taken to not
    mix server-side templating \nwith client-side templating, as the server-side templating
    will not encode things \nlike {{ 7*7 }} which may execute client-side templating
    features.\n\nIt is _NOT_ advised to encode user input prior to inserting into
    a data\nstore. The data will need to be encoded depending on context of where
    it is output. \nIt is much safer to force the displaying system to handle the
    encoding and \nnot attempt to guess how it should be encoded.\n\nTo handle different
    contexts, one approach would be to write custom mako\nfilters. Below is an example
    that escapes or encodes links and \npotentially malicious script, note this does
    not include other contexts \nsuch as CSS or attributes:\n```\n# filters.py module:\n\
    \ndef escape_link(value):\n    bad_link = \"#JinjatmplZ\"\n    # Block any values
    that start with // as that could be used to inject\n    # links to third party
    pages see:\nhttps://en.wikipedia.org/wiki/Wikipedia:Protocol-relative_URL\n  \
    \  if value.startswith('//'):\n        return bad_link\n\n    # Only allow relative
    links\n    # if you want to allow links that start with http or ws replace with
    below:\n    # if not value.startswith('/'): and not value.startswith('http') and
    not\nvalue.startswith('ws')\n    if not value.startswith('/'):\n        return
    bad_link\n\n    return value\n\n# Create a replacement table\njs_replacement =
    str.maketrans({\n    '\\0': \"\\\\u0000\",\n    '\\t': \"\\\\t\",\n    '\\n':
    \"\\\\n\",\n    '\\v': \"\\\\u000b\",\n    '\\f': \"\\\\f`\",\n    '\\r': \"\\\
    \\r\",\n    '\"':  \"\\\\u0022\",\n    '`':  \"\\\\u0060\",\n    '&':  \"\\\\\
    u0026\",\n    '\\'': \"\\\\u0027\",\n    '+':  \"\\\\u002b\",\n    '/':  \"\\\\\
    /\",\n    '<':  \"\\\\u003c\",\n    '>':  \"\\\\u003e\",\n    '\\\\': \"\\\\\\\
    \\\",\n    '(': \"\\\\u0028\",\n    ')': \"\\\\u0029\",\n})\n\ndef escape_js(value):\n\
    \    # Escape the input for use in <script> context, USE WITH CAUTION\n    # It
    is strongly recommended to never pass user-supplied input to\n    # the JavaScript
    context.\n\n    # Translate any potential characters using our translation table\n\
    \    return value.translate(js_replacement)\n\n#####################################################################\n\
    # main module:                                                      #\n#####################################################################\n\
    from mako.template import Template\n\n# Define our template, note the calls to
    our custom filters depending\n# on context\ntemplate_text = \"\"\"\n\n<!DOCTYPE
    html>\n<html lang=\"en\">\n<head>\n    <title>My Webpage</title>\n</head>\n<body>\n\
    \    <h1>My Webpage</h1>\n    ${html_context}\n    <a href=\"${link_context |
    escape_link}\">link</a>\n    <script>${script_context | escape_js}</script>\n\
    </body>\n</html>\n\"\"\"\n\n# Load our template with default filters and our imported
    filters for\n# usage in template files\nt = Template(template_text,\n        \
    \    # By default enable the html filter with 'h'\n            default_filters=['h'],\n\
    \            # Import our custom filters\n            imports=[\"from filters
    import escape_link, escape_js\"])\n\n# Render our template\nprint(t.render(html_context=\"\
    <img src=x onerror=alert(1)>\",\n    link_context=\"/# onclick=alert(1)<script>alert(1)</script>\"\
    ,\n    script_context=\"alert(1)<img src=x onerror=alert(1)>\",)\n)\n```\n"
  metadata:
    cwe: CWE-79
    category: security
    owasp:
    - A7:2017-Cross-Site Scripting (XSS)
    - A03:2021-Injection
    - A05:2025-Injection
    shortDescription: Improper neutralization of input during web page 
      generation ('Cross-site Scripting')
    security-severity: Medium
  patterns:
  - pattern-either:
    - pattern: mako.template.Template(...)
    - pattern: mako.lookup.TemplateLookup(...)
  - pattern-not: mako.lookup.TemplateLookup(..., default_filters=["..."])
  - pattern-not: mako.template.Template(..., default_filters=["..."])
  severity: WARNING
- id: python_eval_rule-eval
  languages:
  - python
  message: "The application was found calling the `eval` function with non-literal
    data. If the variable contains \nuser-controlled data, either partially or fully,
    an adversary could compromise the entire system by \nexecuting arbitrary Python
    code.\n\nTo remediate this issue, remove all calls to `eval` and consider alternative
    methods for executing \nthe necessary business logic. There is almost no safe
    method of calling `eval` with user-supplied input.\n\nIf the application only
    needs to convert strings into objects, consider using `json.loads`. In \nsome
    cases `ast.literal_eval` is recommended, but this should be avoided as it can
    still suffer \nfrom other issues such as the ability for malicious code to crash
    the python interpreter or application.\n\nExample using `json.loads`` to load
    in arbitrary data to create data structures:\n```\n# User supplied data as a blob
    of JSON\nuser_supplied_data = \"\"\"{\"user\": \"test\", \"metadata\": [1,2,3]}\"\
    \"\"\n# Load the JSON\nuser_object = json.loads(user_supplied_data)\n# Manually
    add protected properties _after_ loading, never before\nuser_object[\"is_admin\"\
    ] = False\n# Work with the object\n```\n"
  patterns:
  - pattern: eval($X,...)
  - pattern-not: "eval(\"...\")\n"
  - pattern-not: "eval(\"...\" % <... \"...\" ...>)\n"
  - pattern-not: "eval(<... \"...\".format( \"...\" ) ...>)\n"
  - pattern-not-inside: "def eval(...):\n  ...\n...\n"
  metadata:
    cwe: CWE-95
    owasp:
    - A1:2017-Injection
    - A03:2021-Injection
    - A05:2025-Injection
    category: security
    shortDescription: Improper neutralization of directives in dynamically 
      evaluated code ('Eval Injection')
    security-severity: High
  severity: WARNING
