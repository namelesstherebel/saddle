- id: python_crypto_rule-crypto.hazmat-hash-md5
  languages:
  - python
  message: "The application was found using an insecure or risky digest or signature
    algorithm. MD2, MD5\nand SHA1 hash algorithms have been found to be vulnerable
    to producing collisions.\n\nThis means\nthat two different values, when hashed,
    can lead to the same hash value. If the application is\ntrying\nto use these hash
    methods for storing passwords, then it is recommended to switch to a\npassword
    hashing\nalgorithm such as Argon2id or PBKDF2.\nIt is strongly recommended that
    a standard digest algorithm be chosen instead as implementing\na custom algorithm
    is prone to errors.\n\nExample of creating a SHA-384 hash using the `cryptography`
    package:\n```\nfrom cryptography.hazmat.primitives import hashes\n# Create a SHA384
    digest\ndigest = hashes.Hash(hashes.SHA384())\n# Update the digest with some initial
    data\ndigest.update(b\"some data to hash\")\n# Add more data to the digest\ndigest.update(b\"\
    some more data\")\n# Finalize the digest as bytes\nresult = digest.finalize()\n\
    ```\n\nFor more information on secure password storage see OWASP:\n- https://cheatsheetseries.owasp.org/cheatsheets/Password_Storage_Cheat_Sheet.html\n\
