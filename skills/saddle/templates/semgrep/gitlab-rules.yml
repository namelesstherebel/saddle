- id: python_assert_rule-assert-used
  languages:
  - python
  message: "The application was found using `assert` in non-test code. Usually reserved
    for debug and test\ncode, the `assert`\nfunction is commonly used to test conditions
    before continuing execution. However, enclosed\ncode will be removed\nwhen compiling
    Python code to optimized byte code. Depending on the assertion and subsequent\n\
    logic, this could\nlead to undefined behavior of the application or application
    crashes.\n\nTo remediate this issue, remove the `assert` calls. If necessary,
    replace them with either `if`\nconditions or\n`try/except` blocks.\n\nExample
    using `try/except` instead of `assert`:\n```\n# Below try/except is equal to the
    assert statement of:\n# assert user.is_authenticated(), \"user must be authenticated\"\
    \ntry:\n    if not user.is_authenticated():\n        raise AuthError(\"user must
    be authenticated\")\nexcept AuthError as e:\n    # Handle error\n    # ...\n \
    \   # Return, do not continue processing\n    return\n```\n"
  metadata:
    cwe: CWE-754
    category: security
    shortDescription: Improper check for unusual or exceptional conditions
    owasp:
    - A6:2017-Security Misconfiguration
    - A05:2021-Security Misconfiguration
    - A10:2025-Mishandling of Exceptional Conditions
    security-severity: Info
  patterns:
  - pattern: assert(...)
  - pattern-not-inside: "import pytest\n...\n"
  - pattern-not-inside: "import unittest\n...\n"
  severity: INFO
- id: python_bind-all-interfaces_rule-general-bindall-interfaces
  languages:
  - python
  message: "Binding to all network interfaces can potentially open up a service to\n\
    traffic on unintended interfaces, that may not be properly documented or\nsecured.
    By passing \"0.0.0.0\", \"::\" or an empty string as the address to the `socket.bind`\n\
    function,\nthe application will bind to all interfaces.\n\nConsider passing in
    the interface ip address through an environment variable,\nconfiguration file,
    or by determining the primary interface(s) IP address.\n\nExample getting the
    IP address from an environment variable `IP_ADDRESS`:\n```\n# Get the IP_ADDRESS
    env variable, or bind to\n# 127.0.0.1 if it is not set\naddress = os.getenv(\"\
    IP_ADDRESS\", \"127.0.0.1\")\n# Create an internet socket\nsock = socket.socket(socket.AF_INET)\n\
    # Set the port to listen on\nport = 9777\n# Bind to the address and port combination\n\
    sock.bind((address, port))\n# Listen for connections\nsock.listen()\n# Handle
    the connection\n```\n"
  patterns:
  - pattern-either:
    - pattern: "$S = socket.socket(...)\n...\n$S.bind((\"0.0.0.0\", ...))\n"
    - pattern: "$S = socket.socket(...)\n...\n$S.bind((\"::\", ...))\n"
    - pattern: "$S = socket.socket(...)\n...\n$S.bind((\"\", ...))\n"
  metadata:
    category: security
    owasp:
    - A6:2017-Security Misconfiguration
    - A01:2021-Broken Access Control
    - A01:2025-Broken Access Control
    shortDescription: Binding to an unrestricted IP address
    cwe: CWE-1327
    security-severity: Low
  severity: INFO
- id: python_crypto_rule-cipher-modes
  languages:
  - python
  message: "Cryptographic algorithms provide many different modes of operation, only
    some of which provide\nmessage integrity. Without message integrity it could be
    possible for an adversary to attempt\nto tamper with the ciphertext which could
    lead to compromising the encryption key. Newer\nalgorithms\napply message integrity
    to validate ciphertext has not been tampered with.\n\nInstead of using an algorithm
    that requires configuring a cipher mode, an algorithm\nthat has built-in message
    integrity should be used. Consider using `ChaCha20Poly1305` or\n`AES-256-GCM`
    instead.\n\nFor older applications that don't have support for `ChaCha20Poly1305`,
    `AES-256-GCM` is\nrecommended, however it has many drawbacks:\n  - Slower than
    `ChaCha20Poly1305`.\n  - Catastrophic failure if nonce values are reused.\n\n\
    Example using `ChaCha20Poly1305`:\n```\nimport os\n# Import ChaCha20Poly1305 from
    cryptography\nfrom cryptography.hazmat.primitives.ciphers.aead import ChaCha20Poly1305\n\
    # Our plaintext to encrypt\nplain_text = b\"Secret text to encrypt\"\n# We do
    not require authenticated but unencrypted data, so set to None\naad = None\n#
    Generate a secure key\nkey = ChaCha20Poly1305.generate_key()\n# Create a new ChaCha20Poly1305
    instance with our secure key\nchacha = ChaCha20Poly1305(key)\n# Note: nonce values
    _must_ be regenerated every time they are used.\nnonce = os.urandom(12)\n# Encrypt
    our plaintext\ncipher_text = chacha.encrypt(nonce, plain_text, aad)\n# Decrypt
    the plain text using the nonce and cipher_text\nchacha.decrypt(nonce, cipher_text,
    aad)\n```\n\nExample using `AESGCM`:\n```\nimport os\n# Import AESGCM from cryptography\n\
    from cryptography.hazmat.primitives.ciphers.aead import AESGCM\n# Our plaintext
    to encrypt\nplain_text = b\"Secret text to encrypt\"\n# We do not require authenticated
    but unencrypted data, so set to None\naad = None\n# Generate a secure key\nkey
    = AESGCM.generate_key(bit_length=128)\n# Create a new AESGCM instance with our
    secure key\naesgcm = AESGCM(key)\n# Note: nonce values _must_ be regenerated every
    time they are used.\nnonce = os.urandom(12)\n# Encrypt our plaintext\ncipher_text
    = aesgcm.encrypt(nonce, plain_text, aad)\n# Decrypt the plain text using the nonce
    and cipher_text\naesgcm.decrypt(nonce, cipher_text, aad)\n```\n\nFor more information
    on the cryptography module see:\n- https://cryptography.io/en/latest/\n"
  metadata:
    cwe: CWE-327
    owasp:
    - A3:2017-Sensitive Data Exposure
    - A02:2021-Cryptographic Failures
    - A04:2025-Cryptographic Failures
    category: security
    shortDescription: Use of a broken or risky cryptographic algorithm
    security-severity: Medium
  pattern: cryptography.hazmat.primitives.ciphers.modes.ECB(...)
  severity: WARNING
- id: python_crypto_rule-crypto-cipher-blowfish
  languages:
  - python
  message: "The Blowfish encryption algorithm was meant as a drop-in replacement for
    DES and was created in\n1993. Smaller key sizes may make the ciphertext vulnerable
    to [birthday\nattacks](https://en.wikipedia.org/wiki/Birthday_attack). While no
    known attacks against\nBlowfish\nexist, it should never be used to encrypt files
    over 4GB in size. If possible consider\nusing ChaCha20Poly1305 or AES-GCM instead
    of Blowfish.\n\nFor older applications that don't have support for `ChaCha20Poly1305`,
    `AES-256-GCM` is\nrecommended, however it has many drawbacks:\n  - Slower than
    `ChaCha20Poly1305`.\n  - Catastrophic failure if nonce values are reused.\n\n\
    Note that the `Crypto` and `Cryptodome` Python packages are no longer recommended
    for\nnew applications, instead consider using the [cryptography](https://cryptography.io/)
    package.\n\nExample using `ChaCha20Poly1305`:\n```\nimport os\n# Import ChaCha20Poly1305
    from cryptography\nfrom cryptography.hazmat.primitives.ciphers.aead import ChaCha20Poly1305\n\
    # Our plaintext to encrypt\nplain_text = b\"Secret text to encrypt\"\n# We do
    not require authenticated but unencrypted data, so set to None\naad = None\n#
    Generate a secure key\nkey = ChaCha20Poly1305.generate_key()\n# Create a new ChaCha20Poly1305
    instance with our secure key\nchacha = ChaCha20Poly1305(key)\n# Note: nonce values
    _must_ be regenerated every time they are used.\nnonce = os.urandom(12)\n# Encrypt
    our plaintext\ncipher_text = chacha.encrypt(nonce, plain_text, aad)\n# Decrypt
    the plain text using the nonce and cipher_text\nchacha.decrypt(nonce, cipher_text,
    aad)\n```\n\nExample using `AESGCM`:\n```\nimport os\n# Import AESGCM from cryptography\n\
    from cryptography.hazmat.primitives.ciphers.aead import AESGCM\n# Our plaintext
    to encrypt\nplain_text = b\"Secret text to encrypt\"\n# We do not require authenticated
    but unencrypted data, so set to None\naad = None\n# Generate a secure key\nkey
    = AESGCM.generate_key(bit_length=128)\n# Create a new AESGCM instance with our
    secure key\naesgcm = AESGCM(key)\n# Note: nonce values _must_ be regenerated every
    time they are used.\nnonce = os.urandom(12)\n# Encrypt our plaintext\ncipher_text
    = aesgcm.encrypt(nonce, plain_text, aad)\n# Decrypt the plain text using the nonce
    and cipher_text\naesgcm.decrypt(nonce, cipher_text, aad)\n```\n\nFor more information
    on the cryptography module see:\n- https://cryptography.io/en/latest/\n"
  metadata:
    cwe: CWE-327
    owasp:
    - A3:2017-Sensitive Data Exposure
    - A02:2021-Cryptographic Failures
    - A04:2025-Cryptographic Failures
    category: security
    shortDescription: Use of a broken or risky cryptographic algorithm
    security-severity: Medium
