  message: "The application was found passing in a non-literal value to the `urllib`
    methods which issue\nrequests. `urllib` supports the `file://` scheme, which may
    allow an adversary who can control\nthe URL value to read arbitrary files on the
    file system.\n\nTo remediate this issue either hardcode the URLs being used in
    urllib or use the `requests`\nmodule instead.\n\nExample using the `requests`
    module to issue an HTTPS request:\n```\nimport requests\n# Issue a GET request
    to https://example.com with a timeout of 10 seconds\nresponse = requests.get('https://example.com',
    timeout=10)\n# Work with the response object\n# ...\n```\n"
