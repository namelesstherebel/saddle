    data structures:\n```\n# User supplied data as a blob of JSON\nuser_supplied_data
    = \"\"\"{\"user\": \"test\", \"metadata\": [1,2,3]}\"\"\"\n# Load the JSON\nuser_object
    = json.loads(user_supplied_data)\n# Manually add protected properties _after_
    loading, never before\nuser_object[\"is_admin\"] = False\n# Work with the object\n\
    ```\n"
