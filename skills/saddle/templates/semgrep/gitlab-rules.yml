- id: python_ftp_rule-ftplib
  languages:
  - python
  message: "The application was found using an FTP library. As FTP does not provide
    encryption, it is\nstrongly recommended that any file transfers be done over a
    more secure transport such as\nSSH.\n\nThe [paramiko](https://www.paramiko.org/)
    library can be used with an SCP module to allow\nsecure file transfers.\n\nExample
    using `paramiko` SSH client and the `scp` module:\n```\nimport paramiko\nimport
    scp\n\n# Create an SSH client\nwith paramiko.SSHClient() as ssh:\n    # Load the
    system host keys so we can confirm the\n    # host we are connecting to is legitimate\n\
    \    ssh.load_system_host_keys('/home/appuser/.ssh/known_hosts')\n\n    # Connect
    to the remote host using our SSH private key\n    ssh.connect(hostname='example.org',\n\
    \                port=22,\n                username='appuser',\n             \
    \   key_filename='/home/appuser/.ssh/private_key')\n\n    # Create an SCP client
    with the ssh transport and copy files\n    with scp.SCPClient(ssh.get_transport())
    as secure_copy:\n        secure_copy.get('remote/test.file', 'local/test.file')\n\
    \        secure_copy.put('local/some.file', 'remote/some.file')\n```\n\nFor more
    information on the paramiko module see:\n- https://www.paramiko.org/\n\nFor more
    information on the scp module see:\n- https://github.com/jbardin/scp.py\n"
  metadata:
    cwe: CWE-319
    owasp:
    - A3:2017-Sensitive Data Exposure
    - A02:2021-Cryptographic Failures
    - A04:2025-Cryptographic Failures
    category: security
    shortDescription: Cleartext transmission of sensitive information
    security-severity: Medium
  pattern: ftplib.$ANYTHING(...)
  severity: WARNING
- id: python_log_rule-logging-config-insecure-listen
  languages:
  - python
  message: "The application was found calling the `logging.config.listen`` function,
    which provides the\nability to listen for\nexternal configuration files over a
    socket server. This listen socket parses part of the\nconfiguration and calls\n\
    `eval` on the supplied configuration file. A local user, or an adversary who is
    able to\nexploit\na Server Side Request Forgery (SSRF) attack to communicate over
    localhost, would be able to\nexecute arbitrary\ncode by passing in a logging config
    that contains python code.\n\nTo remediate the issue, remove the call to `logging.config.listen`
    method.\n\nFor more information on the listen functionality see:\n- https://docs.python.org/3/library/logging.config.html#logging.config.listen\n"
